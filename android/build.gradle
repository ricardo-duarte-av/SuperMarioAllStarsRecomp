// Super Mario All-Stars for Android. Build: cd android && ./gradlew assembleRelease (see android/README.md).
buildscript {
    repositories {
        mavenCentral()
        google()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.0'
    }
}

allprojects {
    repositories {
        mavenCentral()
        google()
    }
}
