plugins {
    id 'com.android.application'
}

// The game's version comes from the repository's VERSION file, like the desktop builds.
def gameVersion = file('../../VERSION').text.trim()
// The ROM the player must pick, from rom_identity.txt (the same file the desktop build reads), so a
// change of revision is made in one place. The app's translated code is generated from that ROM.
def romSha256 = file('../../rom_identity.txt').readLines()
        .collect { it.replaceAll(/#.*/, '').trim() }
        .find { it ==~ /expected_sha256\s*=.*/ }?.split('=', 2)?.getAt(1)?.trim()?.replaceAll(/["']/, '')
if (!(romSha256 ==~ /[0-9a-f]{64}/)) throw new GradleException("rom_identity.txt has no expected_sha256")
// Reuse an SDL3 source tree that is already on disk (any desktop build fetched one) instead of
// downloading it again; otherwise the engine downloads its pinned SDL3 release itself.
def sdlSource = ['../../build-win/_deps/sdl3-src', '../../build/_deps/sdl3-src']
        .collect { file(it) }.find { new File(it, 'CMakeLists.txt').exists() }

// Release signing key, kept OUTSIDE the repository (tools/make_android.sh says where). Without it the
// release build is left unsigned and make_android.sh refuses to package it.
def signingFile = new File(System.getenv('SMAS_ANDROID_SIGNING') ?: "${System.getProperty('user.home')}/.smas-android-signing/key.properties")
def signing = new Properties()
if (signingFile.exists()) signingFile.withInputStream { signing.load(it) }

android {
    namespace = "com.tanookistudios.smas"
    signingConfigs {
        release {
            if (signing.storeFile) {
                storeFile file(signing.storeFile)
                storePassword signing.storePassword
                keyAlias signing.keyAlias
                keyPassword signing.keyPassword
            }
        }
    }
    compileSdkVersion 35
    ndkVersion = "28.2.13676358"
    defaultConfig {
        applicationId "com.tanookistudios.smas"
        minSdkVersion 24
        targetSdkVersion 35
        versionCode 1
        versionName gameVersion
        buildConfigField "String", "ROM_SHA256", "\"${romSha256}\""
        externalNativeBuild {
            cmake {
                arguments "-DANDROID_PLATFORM=android-24", "-DANDROID_STL=c++_static",
                          "-DCMAKE_BUILD_TYPE=Release"
                if (sdlSource != null) arguments "-DSNESRECOMP_SDL3_SOURCE_DIR=${sdlSource.absolutePath}"
                abiFilters 'arm64-v8a'
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            if (signing.storeFile) signingConfig signingConfigs.release
        }
    }
    externalNativeBuild {
        cmake {
            // The same CMakeLists.txt as the desktop builds; it builds libmain.so on Android.
            path '../../CMakeLists.txt'
            version '3.22.1'
        }
    }
    buildFeatures {
        buildConfig = true
    }
    lint {
        abortOnError = false
    }
}
