# Super Mario All-Stars (USA) — LLE-first seed
# Regenerate with tools/regen.sh. Promote functions by editing recomp/symbols.toml
# and re-running the regen script, which rewrites the block below.
bank = 0
auto_vectors
tier_down_stubs

# Reset vector $8000, native NMI $82d8 (from the cartridge header).

# >>> BEGIN symbols.toml (generated — do not edit)
symbol 008000 I_RESET
force_lle 008000
symbol 0082d8 I_NMI
force_lle 0082d8
# <<< END symbols.toml

